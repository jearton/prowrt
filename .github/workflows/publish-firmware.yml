name: Publish ProWrt firmware to GHCR

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release tag, matching an existing Git tag
        required: true
        type: string
      verify_only:
        description: Verify the public artifact without publishing again
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-firmware-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
      FIRMWARE_IMAGE: openwrt-x86-64-generic-squashfs-combined-efi.img.gz
      PACKAGE_MANIFEST: openwrt-x86-64-generic.manifest

    steps:
      - name: Validate release tag
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9][a-zA-Z0-9._-]{0,126}$ ]]
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.release_tag }}
          persist-credentials: false
      - name: Download and verify the release bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          metadata_args=()
          if test -f VERSION; then
            sudo apt-get update -q
            sudo apt-get install -qy --no-install-recommends squashfs-tools
            metadata_args=(--pattern build.json)
          fi
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir firmware \
            --pattern "$FIRMWARE_IMAGE" --pattern "$PACKAGE_MANIFEST" --pattern SHA256SUMS "${metadata_args[@]}"
          ./scripts/verify-firmware.sh firmware
      - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1
        with:
          version: 1.3.0
      - name: Publish and verify the OCI artifact
        if: ${{ !inputs.verify_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ref="ghcr.io/${GITHUB_REPOSITORY,,}:$RELEASE_TAG"
          revision=$(git rev-parse HEAD)
          printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          (
            cd firmware
            metadata_files=()
            if test -f build.json; then metadata_files=(build.json:application/json); fi
            oras push "$ref" \
              --artifact-type application/vnd.openwrt.firmware.v1 \
              --annotation "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --annotation "org.opencontainers.image.version=$RELEASE_TAG" \
              --annotation "org.opencontainers.image.revision=$revision" \
              --annotation "org.opencontainers.image.description=ProWrt x86/64 squashfs UEFI firmware and APK manifest" \
              "$FIRMWARE_IMAGE:application/gzip" \
              "$PACKAGE_MANIFEST:text/plain" \
              "${metadata_files[@]}" \
              "SHA256SUMS:text/plain"
          )
          digest=$(oras manifest fetch --descriptor "$ref" | jq -er .digest)
          immutable_ref="${ref%:*}@$digest"
          oras pull "$immutable_ref" --output published
          ./scripts/verify-firmware.sh published
          printf '### Verified firmware\n\n`oras pull %s`\n' "$immutable_ref" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify public anonymous download
        run: |
          registry_config="$RUNNER_TEMP/ghcr-anonymous.json"
          printf '{"auths":{}}\n' > "$registry_config"
          ref="ghcr.io/${GITHUB_REPOSITORY,,}:$RELEASE_TAG"
          digest=$(oras resolve "$ref" --registry-config "$registry_config")
          immutable_ref="${ref%:*}@$digest"
          env -u ORAS_CACHE oras pull "$immutable_ref" \
            --registry-config "$registry_config" --output anonymous
          ./scripts/verify-firmware.sh anonymous
          printf '### Anonymous download verified\n\n`oras pull %s`\n' "$immutable_ref" >> "$GITHUB_STEP_SUMMARY"
