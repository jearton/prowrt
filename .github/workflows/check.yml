name: Check repository

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check image manifest and Netdata patches
        run: |
          (cd manifests && sha256sum --strict --ignore-missing -c SHA256SUMS)
          bash -n scripts/prepare-openwrt.sh scripts/verify-firmware.sh scripts/build-full.sh scripts/prepare-technitium-luci.sh
          bash -n scripts/check-fresh-lan.sh
          python3 -c 'import ast; ast.parse(open("scripts/lan-vm.py").read())'
          python3 -c 'import ast; ast.parse(open("scripts/check-rootfs-permissions.py").read())'
          python3 -c 'import ast; ast.parse(open("scripts/check-ttyd-login.py").read())'
          sh -n sources/full/files/etc/uci-defaults/93-technitium-dns sources/full/files/etc/init.d/technitium-provision sources/full/files/usr/libexec/technitium-provision
          sh -n sources/full/files/usr/libexec/prowrt-openclash-dns sources/full/package/custom/luci-app-openclash/root/etc/init.d/openclash sources/full/package/custom/luci-app-openclash/root/usr/share/openclash/yml_change.sh
          python3 - <<'PY'
          from pathlib import Path
          import json
          import shutil
          import subprocess
          import tempfile

          repo = Path.cwd()
          configs = list(repo.glob("*.lock.json")) + list((repo / "image-files").rglob("*.json"))
          for config in configs:
              json.loads(config.read_text())

          with tempfile.TemporaryDirectory() as directory:
              tree = Path(directory)
              shutil.copytree(repo / "packages/netdata", tree / "package/custom/netdata")
              shutil.copytree(repo / "sources/full/package/custom/luci-app-netdata", tree / "package/custom/luci-app-netdata")
              subprocess.run(["git", "init", "-q"], cwd=tree, check=True)
              for name in ("netdata-config-readable", "netdata-container-network", "netdata-overview", "netdata-luci-bundled-dashboard"):
                  patch = repo / f"patches/custom-ipv4/{name}.patch"
                  subprocess.run(["git", "apply", "--check", str(patch)], cwd=tree, check=True)
                  subprocess.run(["git", "apply", str(patch)], cwd=tree, check=True)
              for script in ("extract-asset.sh", "files/netdata.init"):
                  subprocess.run(["sh", "-n", str(tree / "package/custom/netdata" / script)], check=True)
          PY
          python3 -c 'import ast; ast.parse(open("packages/netdata/prepare-overview.py").read())'
          node --check packages/netdata/files/overview/bootstrap.js
          node --check scripts/check-netdata-overview.cjs
      - name: Check firmware identity and cache boundaries
        run: |
          sudo apt-get update -q
          sudo apt-get install -qy --no-install-recommends squashfs-tools
          python3 -m unittest discover -s tests -p 'test_build_support.py' -v
          node tests/check-prowrt-status.cjs
          sh -n sources/full/files/usr/bin/prowrt-version
          python3 scripts/build-metadata.py generate "$RUNNER_TEMP/build.json"
          python3 scripts/build-metadata.py verify "$RUNNER_TEMP/build.json"
          test -x sources/full/files/usr/bin/prowrt-version
      - name: Check independently pinned OpenClash dashboards
        run: |
          python3 -m unittest discover -s tests -p 'test_openclash_ui.py' -v
          python3 scripts/check-openclash-ui.py "$RUNNER_TEMP/openclash-ui"
      - name: Check the pinned standalone Technitium packages
        run: |
          packages=$(mktemp -d)
          scripts/prepare-technitium-luci.sh "$packages"
          sh -n "$packages/technitium/files/run" "$packages/technitium/files/technitium.init"
          node --check "$packages/luci-app-technitium/htdocs/luci-static/resources/view/technitium/status.js"
          grep -Fx 'PKG_RELEASE:=2' "$packages/technitium/Makefile"
          grep -Fx 'PKG_VERSION:=1.1.0' "$packages/luci-app-technitium/Makefile"
      - name: Check Technitium loopback ports
        run: |
          docker compose -f containers/technitium/compose.yaml config --format json |
            python3 -c '
          import json, sys
          service = json.load(sys.stdin)["services"]["technitium"]
          actual = {(p["host_ip"], int(p["published"]), p["target"], p["protocol"]) for p in service["ports"]}
          expected = {("127.0.0.1", 1053, 53, "tcp"), ("127.0.0.1", 1053, 53, "udp"),
                      ("127.0.0.1", 5380, 5380, "tcp")}
          if actual != expected:
              raise SystemExit(f"Unexpected Technitium port mappings: {actual}")
          '
