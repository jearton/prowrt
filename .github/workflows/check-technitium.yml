name: Reproduce Technitium first boot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-technitium.yml'
      - 'scripts/check-fresh-lan.sh'
      - 'scripts/lan-vm.py'
      - 'scripts/check-ttyd-login.py'
      - 'patches/custom-ipv4/ttyd-luci-session.patch'
      - 'sources/full/files/etc/uci-defaults/93-ttyd-luci-session'
      - 'sources/full/files/**technitium**'

permissions:
  contents: read

jobs:
  firstboot:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Prepare isolated VM tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -qy --no-install-recommends qemu-system-x86 ovmf python3-websocket dnsutils tcpdump
          if test -c /dev/kvm; then
            sudo chown "$(id -u)" /dev/kvm
            test -r /dev/kvm && test -w /dev/kvm
          fi
      - name: Fetch checksum-pinned regression image and released APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/technitium-apks"
          gh release download v25.12.6-20261118 --repo "$GITHUB_REPOSITORY" \
            --pattern openwrt-x86-64-generic-squashfs-combined-efi.img.gz --dir "$RUNNER_TEMP"
          printf '%s  %s\n' 676599499413774b57b0f728a16d00a2929e2234ac6be9693705b083471638cf \
            "$RUNNER_TEMP/openwrt-x86-64-generic-squashfs-combined-efi.img.gz" | sha256sum --strict -c -
          gh release download v1.1.0 --repo jearton/luci-app-technitium \
            --pattern '*.apk' --pattern SHA256SUMS --pattern packages.adb --dir "$RUNNER_TEMP/technitium-apks"
          (cd "$RUNNER_TEMP/technitium-apks" && sha256sum --strict -c SHA256SUMS)
          # The old regression image did not include a TLS certificate generator.
          # This helper is test-only; the final image builds px5g from its pinned OpenWrt source.
          curl -fLsS --retry 3 --max-time 60 \
            https://downloads.openwrt.org/releases/25.12.6/packages/x86_64/base/px5g-mbedtls-13.apk \
            -o "$RUNNER_TEMP/technitium-apks/px5g-mbedtls-13.apk"
          printf '%s  %s\n' 76cd0142c88ee9c8d41d733419e764f47b1a6a147382f74a43e50be457d2faea \
            "$RUNNER_TEMP/technitium-apks/px5g-mbedtls-13.apk" | sha256sum --strict -c -
          for package in openssl-util libopenssl-conf; do
            curl -fLsS --retry 3 --max-time 60 \
              "https://downloads.openwrt.org/releases/25.12.6/packages/x86_64/base/$package-3.5.9-r1.apk" \
              -o "$RUNNER_TEMP/technitium-apks/$package-3.5.9-r1.apk"
          done
          printf '%s  %s\n' \
            f975772e376ce05c46efbc4f4f2bee1575109454cb928333b65010dd526b1783 "$RUNNER_TEMP/technitium-apks/openssl-util-3.5.9-r1.apk" \
            d97dec1fd2eb9cddd5281989ccb8708c7c1de557d625aad39b5af3ebfd9d86d9 "$RUNNER_TEMP/technitium-apks/libopenssl-conf-3.5.9-r1.apk" | sha256sum --strict -c -
          mkdir -p "$RUNNER_TEMP/ttyd-test/utils/ttyd/files"
          curl -fLsS --retry 3 --max-time 60 \
            https://raw.githubusercontent.com/openwrt/packages/093d551675b1119a06ef224d419905e8d6b2af1a/utils/ttyd/files/ttyd.init \
            -o "$RUNNER_TEMP/ttyd-test/utils/ttyd/files/ttyd.init"
          git -C "$RUNNER_TEMP/ttyd-test" init -q
          git -C "$RUNNER_TEMP/ttyd-test" apply --include=utils/ttyd/files/ttyd.init --include=utils/ttyd/files/ttyd-login \
            "$GITHUB_WORKSPACE/patches/custom-ipv4/ttyd-luci-session.patch"
          python3 scripts/check-ttyd-tls.py "$RUNNER_TEMP/ttyd-test/utils/ttyd/files/ttyd.init"
          sh -n "$RUNNER_TEMP/ttyd-test/utils/ttyd/files/ttyd-login"
      - name: Reproduce first initialization and check LAN services
        env:
          FRESH_LAN_FIXTURE_APKS: ${{ runner.temp }}/technitium-apks
          FRESH_LAN_FIXTURE_TTYD_INIT: ${{ runner.temp }}/ttyd-test/utils/ttyd/files/ttyd.init
        run: bash scripts/check-fresh-lan.sh "$RUNNER_TEMP/openwrt-x86-64-generic-squashfs-combined-efi.img.gz"
