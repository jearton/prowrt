name: Build full firmware and publish candidate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-firmware.yml'
      - 'scripts/build-full.sh'
      - 'scripts/build-cache.py'
      - 'scripts/build-metadata.py'
      - 'scripts/build-metrics.py'
      - 'VERSION'
      - 'scripts/check-rootfs-permissions.py'
      - 'scripts/prepare-technitium-luci.sh'
      - 'scripts/prepare-dns-service-hook.py'
      - 'scripts/prepare-openclash.py'
      - 'scripts/prepare-nlbwmon.py'
      - 'scripts/prepare-uhttpd.py'
      - 'scripts/prepare-quickstart-devices.py'
      - '*.lock.json'
      - 'sources/full/**'
      - 'profiles/network-ui.config'
      - 'packages/**'
      - 'patches/**'
      - 'image-files/**'
      - 'manifests/openwrt-x86-64-generic.manifest'

permissions:
  contents: read
  packages: write

concurrency:
  group: build-full-firmware-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set disposable build and persistent-cache paths
        run: |
          printf 'OPENWRT_CACHE_ROOT=%s/prowrt-cache\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'OPENWRT_METRICS_DIR=%s/build-metrics\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Prepare the Linux build host
        run: |
          started=$SECONDS
          sudo python3 - <<'PY'
          import shutil
          from pathlib import Path
          for directory in ("/usr/local/lib/android", "/usr/share/dotnet", "/opt/ghc"):
              path = Path(directory)
              if path.is_dir() and not path.is_symlink():
                  shutil.rmtree(path)
          PY
          sudo apt-get update -q
          sudo apt-get install -qy build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev libelf-dev \
            python3-dev python3-setuptools rsync swig unzip zlib1g-dev \
            file gperf time zstd xz-utils squashfs-tools gnutls-bin
          df -h "$RUNNER_TEMP"
          python3 scripts/build-metrics.py "$OPENWRT_METRICS_DIR" host-preparation "$((SECONDS-started))"

      - name: Identify compatible cache inputs
        id: cache-key
        run: |
          input_hash=$(python3 scripts/build-cache.py keys)
          host_gcc=$(gcc -dumpfullversion)
          printf 'prefix=prowrt-v1-%s-%s-gcc%s-%s\n' "$RUNNER_OS" "$RUNNER_ARCH" "$host_gcc" "$input_hash" >> "$GITHUB_OUTPUT"
          printf 'compatible=prowrt-v1-%s-%s-gcc%s-\n' "$RUNNER_OS" "$RUNNER_ARCH" "$host_gcc" >> "$GITHUB_OUTPUT"

      - name: Restore verified download inputs
        id: downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ env.OPENWRT_CACHE_ROOT }}/dl
            ${{ env.OPENWRT_CACHE_ROOT }}/assets
          key: prowrt-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: prowrt-downloads-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore compatible compiler cache
        id: ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.OPENWRT_CACHE_ROOT }}/ccache
          key: ${{ steps.cache-key.outputs.prefix }}-${{ github.run_id }}-${{ github.run_attempt }}
          # ccache validates compiler contents, flags and source. A changed
          # package selection need not discard valid objects for unchanged code.
          restore-keys: |
            ${{ steps.cache-key.outputs.prefix }}-
            ${{ steps.cache-key.outputs.compatible }}

      - name: Compile the complete x86/64 image
        env:
          PROWRT_CACHE_KEY: ${{ steps.cache-key.outputs.prefix }}
          PROWRT_DL_CACHE_MATCH: ${{ steps.downloads.outputs.cache-matched-key }}
          PROWRT_CCACHE_MATCH: ${{ steps.ccache.outputs.cache-matched-key }}
        run: ./scripts/build-full.sh "$RUNNER_TEMP/openwrt" "$RUNNER_TEMP/firmware"

      - name: Bound reusable caches
        if: ${{ always() && github.ref == 'refs/heads/main' && steps.cache-key.outcome == 'success' }}
        run: |
          if test -d "$OPENWRT_CACHE_ROOT/dl"; then
            python3 scripts/build-cache.py trim "$OPENWRT_CACHE_ROOT"
          fi
          if test -x "$RUNNER_TEMP/openwrt/staging_dir/host/bin/ccache"; then
            CCACHE_DIR="$OPENWRT_CACHE_ROOT/ccache" CCACHE_MAXSIZE=2G \
              "$RUNNER_TEMP/openwrt/staging_dir/host/bin/ccache" --cleanup
          fi

      # Cache only public inputs and compiler objects, never staging_dir,
      # build_dir, files/, firmware images, runtime state, credentials or keys.
      - name: Save downloads for future builds
        if: ${{ always() && github.ref == 'refs/heads/main' && steps.downloads.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ env.OPENWRT_CACHE_ROOT }}/dl
            ${{ env.OPENWRT_CACHE_ROOT }}/assets
          key: ${{ steps.downloads.outputs.cache-primary-key }}

      - name: Save compiler cache for future builds
        if: ${{ always() && github.ref == 'refs/heads/main' && steps.ccache.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.OPENWRT_CACHE_ROOT }}/ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      - name: Preserve the compiled image before acceptance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unverified-firmware-${{ github.sha }}
          path: ${{ runner.temp }}/firmware/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Boot the new image and check LAN services
        run: |
          sudo apt-get install -qy --no-install-recommends qemu-system-x86 ovmf python3-websocket dnsutils tcpdump
          if test -c /dev/kvm; then
            sudo chown "$(id -u)" /dev/kvm
            test -r /dev/kvm && test -w /dev/kvm
          fi
          started=$SECONDS
          result=0
          bash scripts/check-fresh-lan.sh "$RUNNER_TEMP/firmware/openwrt-x86-64-generic-squashfs-combined-efi.img.gz" || result=$?
          state=success
          [[ $result == 0 ]] || state=failure
          python3 scripts/build-metrics.py "$OPENWRT_METRICS_DIR" isolated-boot "$((SECONDS-started))" --status "$state"
          exit "$result"

      - name: Preserve complete compiler diagnostics
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/openwrt/build.log"; then
            mkdir -p "$OPENWRT_METRICS_DIR"
            gzip -1c "$RUNNER_TEMP/openwrt/build.log" > "$OPENWRT_METRICS_DIR/compile.log.gz"
          fi

      - name: Preserve build timings and cache statistics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-metrics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.OPENWRT_METRICS_DIR }}/*.json
            ${{ env.OPENWRT_METRICS_DIR }}/*.txt
            ${{ env.OPENWRT_METRICS_DIR }}/compile.log.gz
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize build timings
        if: always()
        run: |
          if test -f "$OPENWRT_METRICS_DIR/build-metrics.json"; then
            python3 scripts/build-metrics.py "$OPENWRT_METRICS_DIR" --summary >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1
        with:
          version: 1.3.0

      - name: Publish and verify candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ref="ghcr.io/${GITHUB_REPOSITORY,,}:ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          image=openwrt-x86-64-generic-squashfs-combined-efi.img.gz
          manifest=openwrt-x86-64-generic.manifest
          printf '%s' "$GH_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          (
            cd "$RUNNER_TEMP/firmware"
            oras push "$ref" --artifact-type application/vnd.openwrt.firmware.v1 \
              --annotation "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --annotation "org.opencontainers.image.revision=$GITHUB_SHA" \
              --annotation "org.opencontainers.image.description=OpenWrt x86/64 CI candidate" \
              "$image:application/gzip" "$manifest:text/plain" build.json:application/json SHA256SUMS:text/plain
          )
          digest=$(oras manifest fetch --descriptor "$ref" | jq -er .digest)
          immutable_ref="${ref%:*}@$digest"
          oras pull "$immutable_ref" --output "$RUNNER_TEMP/ghcr-check"
          (
            cd "$RUNNER_TEMP/ghcr-check"
            cmp SHA256SUMS "$RUNNER_TEMP/firmware/SHA256SUMS"
            sha256sum --strict -c SHA256SUMS
          )
          printf '### Full firmware candidate\n\n`oras pull %s`\n' "$immutable_ref" >> "$GITHUB_STEP_SUMMARY"
